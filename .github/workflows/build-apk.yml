name: Build N9 Reborn APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check project ZIP
        run: |
          ls -la
          test -f N9_Reborn_Prototype_1.0.zip

      - name: Extract project
        run: |
          unzip N9_Reborn_Prototype_1.0.zip -d extracted
          ls -la extracted

      - name: Build APK
        working-directory: extracted/N9
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: N9-Reborn-APK-v1.0
          path: extracted/N9/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
